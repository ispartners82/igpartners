        <ul class="nav-menu" id="nav-menu">

            </div>

        </ul>
        <!-- 비로그인 시 깜빡임(FOUC) 원천 차단 및 세션 캐시 기반 0ms 즉시 분기 렌더링 적용 -->
        <div class="nav-auth-area" id="nav-auth-area">
          <div id="auth-user" class="auth-user-badge" style="display: none;">
            <!-- 세션 스토리지에서 유저 정보를 즉시 바인딩하여 렌더링 지연 방지 -->
            <div class="user-capsule">
              <img id="user-photo" src="https://lh3.googleusercontent.com/a/default-user=s96-c" alt="Profile" class="user-avatar">
              <span id="user-name" class="user-nickname"></span>
            </div>
            <a href="/my-reservations.html" id="btn-my-reservations" class="btn-nav-action btn-my-res">📅 예약내역</a>
            <a href="/admin.html" id="btn-admin-dashboard" class="btn-nav-action btn-admin" style="display: none;">👑 관리자</a>
            <a href="/stats.html" id="btn-stats-dashboard" class="btn-nav-action btn-admin" style="display: none;">📊 예약통계</a>
            <button id="btn-logout" class="btn-nav-logout">로그아웃</button>
          </div>
          <button id="btn-login" class="btn-nav-login" style="display: none;">로그인</button>
          <script>
            /* HTML 파싱 즉시(0ms) 세션 캐시를 확인하여 비로그인 깜빡임을 원천 차단하고 로그인 상태는 즉시 노출함 */
            (function () {
              try {
                var c = sessionStorage.getItem("auth_user_cache");
                var authUser = document.getElementById("auth-user");
                var btnLogin = document.getElementById("btn-login");
                if (c) {
                  if (authUser) authUser.style.display = "flex";
                  var u = JSON.parse(c);
                  var nameEl = document.getElementById("user-name");
                  var photoEl = document.getElementById("user-photo");
                  if (nameEl && u.displayName) nameEl.textContent = u.displayName;
                  if (photoEl && u.photoURL) photoEl.src = u.photoURL;

                  var p = sessionStorage.getItem("admin_permissions_" + u.uid);
                  if (p) {
                    var perm = JSON.parse(p);
                    if (perm && perm.permissions) {
                      var isAdm = !!(perm.role === "super_admin" || perm.permissions.isAdmin);
                      var isSt = !!(perm.role === "super_admin" || perm.permissions.hasStats);
                      var adm = document.getElementById("btn-admin-dashboard");
                      if (adm) adm.style.display = isAdm ? "inline-block" : "none";
                      var st = document.getElementById("btn-stats-dashboard");
                      if (st) st.style.display = isSt ? "inline-block" : "none";
                    }
                  }
                } else {
                  if (btnLogin) {
                    btnLogin.style.display = "block";
                    btnLogin.disabled = false;
                  }
                }
              } catch (e) { }
            })();
          </script>

          <a href="/my-reservations.html" id="quick-btn-my-reservations" class="quick-icon-btn" style="display: none;" title="예약내역">📅 예약내역</a>
          <a href="/admin.html" id="quick-btn-admin-dashboard" class="quick-icon-btn" style="display: none;" title="관리자">👑 관리자</a>

  <!-- 상단 네비게이션 바 고정 여백(100px) 확보를 위한 container 영역 -->
  <div class="container" style="margin-top: 100px;">

    <!-- 폼 페이지 헤더 영역 (동적으로 타이틀 및 안내 뱃지 텍스트를 치환하기 위해 ID 부여) -->
    <header class="header">
      <h1 class="title" id="form-page-title"></h1>
      <p class="subtitle" id="form-page-subtitle"></p>

      <!-- 선택된 병원 표기 배지 -->
      <div id="selected-clinic-badge" class="selected-clinic-badge">
        <span id="booking-badge-label"></span> <span id="clinic-name-text"></span>
      </div>
    </header>

    <main class="form-container">
      <form id="reservation-form" class="reservation-form">
        <!-- 2열 그리드 레이아웃 -->
        <div class="form-grid">

          <!-- 1행 좌측: 이름 입력 필드 -->
          <div class="form-group">
            <label for="input-name" id="label-name">이 름 <span class="required">*</span></label>
            <input type="text" id="input-name" required placeholder="예: 홍길동">
          </div>

          <!-- 1행 우측: 성별 선택 필드 -->
          <div class="form-group">
            <label for="input-gender" id="label-gender">성 별 <span class="required">*</span></label>
            <select id="input-gender" required>
              <option value="" disabled selected id="gender-placeholder">성별 선택</option>
              <option value="남성" id="gender-male"> 남성</option>
              <option value="여성" id="gender-female"> 여성</option>
            </select>
          </div>

          <!-- 2행 좌측: 비자타입 입력 필드 -->
          <div class="form-group">
            <label for="input-visa-type" id="label-visa-type">비자타입 <span class="required">*</span></label>
            <input type="text" id="input-visa-type" required placeholder="예시: C-3-9">
          </div>

          <!-- 2행 우측: 외국인등록번호 입력 필드 -->
          <div class="form-group">
            <label for="input-alien-no" id="label-alien-no">외국인등록번호</label>
            <input type="text" id="input-alien-no" placeholder="예: 950101-2******">
          </div>

          <!-- 3행 좌측: 체류 만료일 입력 필드 -->
          <div class="form-group">
            <label for="input-visa-expiry" id="label-visa-expiry">체류 만료일 <span class="required">*</span></label>
            <input type="date" id="input-visa-expiry" required>
          </div>

          <!-- 3행 우측: 생년월일 입력 필드 -->
          <div class="form-group">
            <label for="input-dob" id="label-dob">생년월일 <span class="required">*</span></label>
            <input type="date" id="input-dob" required>
          </div>

          <!-- 4행 좌측: 예약희망일 입력 필드 -->
          <div class="form-group">
            <label for="input-date" id="label-date">예약희망일 <span class="required">*</span></label>
            <input type="date" id="input-date" required>
          </div>

          <!-- 4행 우측: 예약희망시간 선택 필드 (24시간 전 시간대 드롭다운 전용) -->
          <div class="form-group">
            <label for="input-time" id="label-time">예약희망시간 <span class="required">*</span></label>
            <select id="input-time" required>
              <option value="" disabled selected id="time-placeholder">시간을 선택해 주세요</option>
              <option value="00:00">00:00</option>
              <option value="00:30">00:30</option>
              <option value="01:00">01:00</option>
              <option value="01:30">01:30</option>
              <option value="02:00">02:00</option>
              <option value="02:30">02:30</option>
              <option value="03:00">03:00</option>
              <option value="03:30">03:30</option>
              <option value="04:00">04:00</option>
              <option value="04:30">04:30</option>
              <option value="05:00">05:00</option>
              <option value="05:30">05:30</option>
              <option value="06:00">06:00</option>
              <option value="06:30">06:30</option>
              <option value="07:00">07:00</option>
              <option value="07:30">07:30</option>
              <option value="08:00">08:00</option>
              <option value="08:30">08:30</option>
              <option value="09:00">09:00</option>
              <option value="09:30">09:30</option>
              <option value="10:00">10:00</option>
              <option value="10:30">10:30</option>
              <option value="11:00">11:00</option>
              <option value="11:30">11:30</option>
              <option value="12:00">12:00</option>
              <option value="12:30">12:30</option>
              <option value="13:00">13:00</option>
              <option value="13:30">13:30</option>
              <option value="14:00">14:00</option>
              <option value="14:30">14:30</option>
              <option value="15:00">15:00</option>
              <option value="15:30">15:30</option>
              <option value="16:00">16:00</option>
              <option value="16:30">16:30</option>
              <option value="17:00">17:00</option>
              <option value="17:30">17:30</option>
              <option value="18:00">18:00</option>
              <option value="18:30">18:30</option>
              <option value="19:00">19:00</option>
              <option value="19:30">19:30</option>
              <option value="20:00">20:00</option>
              <option value="20:30">20:30</option>
              <option value="21:00">21:00</option>
              <option value="21:30">21:30</option>
              <option value="22:00">22:00</option>
              <option value="22:30">22:30</option>
              <option value="23:00">23:00</option>
              <option value="23:30">23:30</option>
            </select>
          </div>

          <!-- 주소 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-address" id="label-address">현재 주소 <span class="required">*</span></label>
            <input type="text" id="input-address" required placeholder="">
          </div>

          <!-- 현재증상 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-symptoms" id="label-symptoms">현재 증상 <span class="required">*</span></label>
            <textarea id="input-symptoms" rows="4" required placeholder=""></textarea>
          </div>
          <!-- 유입경로는 예약폼에서 입력받지 않고 관리자 페이지에서 직접 기입하도록 정책이 변경됨에 따라 입력란 삭제 -->
          <!-- 연락처 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-phone" id="label-phone">연락처 <span class="required">*</span></label>
            <input type="tel" id="input-phone" required placeholder="예: 010-1234-5678">
          </div>

        </div>

        <!-- 개인정보 동의 체크박스 영역 -->
        <div class="form-agreement">
          <label class="checkbox-container">
            <input type="checkbox" id="agreement-check">
            <span class="checkmark"></span>
            <span class="agreement-text" id="agreement-label-text"></span>
          </label>
        </div>

        <!-- 하단 액션 버튼 영역 -->
        <div class="form-actions">
          <button type="button" id="btn-back" class="btn btn-secondary"></button>
          <button type="submit" id="btn-submit" class="btn btn-primary"></button>
        </div>
      </form>
    </main>
  </div>

  <script type="module" src="/js/navigation.js?v=260918_5"></script>
  <script type="module" src="/js/reservation.js?v=260918_5"></script>
  <script type="module" src="/js/auth.js?v=260918_5"></script>

  <div id="privacy-modal" class="modal-backdrop" style="display: none;">

        <button id="btn-close-modal-x" class="modal-close-x">&times;</button>
      </div>
      <div class="modal-body" id="privacy-modal-body-content">
        <!-- 스크립트에서 동적 로딩되어 들어갑니다 -->
      </div>
      <div class="modal-footer" style="padding: 1.2rem 2rem;">
        <button id="btn-close-modal" class="btn btn-secondary"
          style="font-size: 0.9rem; padding: 0.5rem 1.5rem; min-width: 90px; margin: 0 auto;">확인</button>
