  style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: flex-start;">

    <div class="aurora-2"></div>
  </div>

  <!-- 공통 상단 네비게이션 바 컴포넌트 -->
  <header id="global-header">
    <nav class="common-navbar">
      <div class="nav-container">
        <a href="/index.html" class="nav-brand">
          <img src="/img/logo.png" alt="IGPartners Logo" class="nav-logo">
          <span class="nav-brand-text">IGPartners</span>
        </a>
        <ul class="nav-menu" id="nav-menu">
          <!-- [한글 주석: 상단 메인 메뉴 전용 15개국어 세로 수직 드롭다운 메뉴 (홈 메뉴 바로 왼쪽 정적 배치)] -->
          <li class="nav-item nav-lang-dropdown-wrapper" id="nav-lang-dropdown-container">
            <div class="nav-lang-trigger" id="nav-lang-trigger" onclick="window.toggleLangDropdown(event)">
              <img id="nav-lang-selected-flag" class="nav-lang-flag" src="https://flagcdn.com/w80/kr.png" alt="South Korea Flag">
              <span id="nav-lang-selected-text" class="nav-lang-text">언어선택</span>
              <span class="nav-lang-arrow">▾</span>
            </div>
            <div class="nav-lang-menu-panel" id="nav-lang-menu-panel">
              <div class="nav-lang-panel-header">
                <span>🌐 Select Language / 언어선택</span>
              </div>
              <div class="nav-lang-scroll-list" id="nav-lang-scroll-list">
                <!-- [한글 주석: 15개국 언어 목록은 navigation.js의 bindLangDropdownList()에서 0ms 동적 주입] -->
              </div>
            </div>
          </li>
          <li class="nav-item"><a href="/index.html" class="nav-link">홈</a></li>
          <li class="nav-item"><a href="/about.html" class="nav-link">회사소개</a></li>
          <li class="nav-item"><a href="/about.html#services" class="nav-link">제공 서비스</a></li>
          <li class="nav-item"><a href="/interpreters.html" class="nav-link btn-nav-booking">전문통역</a></li>
          <li class="nav-item"><a href="/booking-lang.html" class="nav-link btn-nav-booking active">진료 예약</a></li>
          <li class="nav-item"><a href="/index.html#partners" class="nav-link">파트너스</a></li>
          <!-- [한글 주석: 상단 커뮤니티 메뉴 - 비로그인 상태에서도 상시 노출] -->
          <li class="nav-item nav-community-item" id="nav-item-community"><a href="/community.html" class="nav-link">커뮤니티</a></li>
        </ul>
        <div class="nav-auth-area" id="nav-auth-area">
          <div id="auth-user" class="auth-user-badge">
            <div class="user-capsule">
              <img id="user-photo" src="https://lh3.googleusercontent.com/a/default-user=s96-c" alt="Profile" class="user-avatar">
              <span id="user-name" class="user-nickname"></span>
            </div>
            <a href="/my-reservations.html" id="btn-my-reservations" class="btn-nav-action btn-my-res">📅 예약내역</a>
            <a href="/admin.html" id="btn-admin-dashboard" class="btn-nav-action btn-admin" style="display: none;">👑 관리자</a>
            <a href="/stats.html" id="btn-stats-dashboard" class="btn-nav-action btn-admin" style="display: none;">📊 예약통계</a>
            <button id="btn-logout" class="btn-nav-logout">로그아웃</button>
          </div>
          <button id="btn-login" class="btn-nav-login" style="display: none;">로그인</button>
        </div>

        <!-- [한글 주석: 모바일 상단 퀵 아이콘 네비게이션 바 - 커뮤니티 아이콘 포함] -->
        <div class="nav-mobile-quick" id="nav-mobile-quick">
          <a href="/index.html" class="quick-icon-btn" title="홈">🏠</a>
          <a href="/about.html" class="quick-icon-btn" title="회사소개">🏢</a>
          <a href="/about.html#services" class="quick-icon-btn" title="제공 서비스">🛠️</a>

          <a href="/index.html#partners" class="quick-icon-btn" title="파트너스">🤝</a>
          <a href="/community.html" class="quick-icon-btn" title="커뮤니티">💬</a>
          <a href="/my-reservations.html" id="quick-btn-my-reservations" class="quick-icon-btn" style="display: none;" title="예약내역">📋</a>
          <a href="/admin.html" id="quick-btn-admin-dashboard" class="quick-icon-btn" style="display: none;" title="관리자">👑</a>
          <a href="/stats.html" id="quick-btn-stats-dashboard" class="quick-icon-btn" style="display: none;" title="예약통계">📊</a>
          <button id="quick-btn-login" class="quick-icon-btn" title="로그인">👤</button>
        </div>

        <!-- [한글 주석: 모바일 화면 전용 햄버거 메뉴 토글 버튼] -->
        <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 토글">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- 상단 네비게이션 바 고정 여백(100px) 확보를 위한 container 영역 -->
  <div class="container" style="margin-top: 100px;">

    <!-- 폼 페이지 헤더 영역 (동적으로 타이틀 및 안내 뱃지 텍스트를 치환하기 위해 ID 부여) -->
    <header class="header">
      <h1 class="title" id="form-page-title"></h1>
      <p class="subtitle" id="form-page-subtitle"></p>

      <!-- 선택된 병원 표기 배지 -->
      <div id="selected-clinic-badge" class="selected-clinic-badge">
        <span id="booking-badge-label"></span> <span id="clinic-name-text"></span>
      </div>
    </header>

    <main class="form-container">
      <form id="reservation-form" class="reservation-form">
        <!-- 2열 그리드 레이아웃 -->
        <div class="form-grid">

          <!-- 이름 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-name" id="label-name">이 름 <span class="required">*</span></label>
            <input type="text" id="input-name" required placeholder="예: 홍길동">
          </div>

          <!-- 성별 (왼쪽 열 배치) -->
          <div class="form-group">
            <label for="input-gender" id="label-gender">성 별 <span class="required">*</span></label>
            <select id="input-gender" required>
              <option value="" disabled selected id="gender-placeholder">성별 선택</option>
              <option value="남성" id="gender-male"> 남성</option>
              <option value="여성" id="gender-female"> 여성</option>
            </select>
          </div>

          <!-- 비자타입 (오른쪽 열 배치) -->
          <div class="form-group">
            <label for="input-visa-type" id="label-visa-type">비자타입 <span class="required">*</span></label>
            <input type="text" id="input-visa-type" required placeholder="예시: C-3-9">
          </div>

          <!-- 외국인등록번호 (왼쪽 열 배치) -->
          <div class="form-group">
            <label for="input-alien-no" id="label-alien-no">외국인등록번호</label>
            <input type="text" id="input-alien-no" placeholder="예: 950101-2******">
          </div>

          <!-- 체류만료일 (오른쪽 열 배치) -->
          <div class="form-group">
            <label for="input-visa-expiry" id="label-visa-expiry">체류 만료일 <span class="required">*</span></label>
            <input type="date" id="input-visa-expiry" required>
          </div>

          <!-- 생년월일 (왼쪽 열 배치) -->
          <div class="form-group">
            <label for="input-dob" id="label-dob">생년월일 <span class="required">*</span></label>
            <input type="date" id="input-dob" required>
          </div>

          <!-- 예약날짜 (오른쪽 열 배치) -->
          <div class="form-group">
            <label for="input-date" id="label-date">진료 예약날짜 <span class="required">*</span></label>
            <input type="date" id="input-date" required>
          </div>

          <!-- 주소 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-address" id="label-address">현재 주소 <span class="required">*</span></label>
            <input type="text" id="input-address" required placeholder="">
          </div>

          <!-- 현재증상 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-symptoms" id="label-symptoms">현재 증상 <span class="required">*</span></label>
            <textarea id="input-symptoms" rows="4" required placeholder=""></textarea>
          </div>
          <!-- [한글 주석: 유입경로는 예약폼에서 입력받지 않고 관리자 페이지에서 직접 기입하도록 정책이 변경됨에 따라 입력란 삭제] -->
          <!-- 연락처 (전체 너비) -->
          <div class="form-group full-width">
            <label for="input-phone" id="label-phone">연락처 <span class="required">*</span></label>
            <input type="tel" id="input-phone" required placeholder="예: 010-1234-5678">
          </div>

        </div>

        <!-- 개인정보 동의 체크박스 영역 -->
        <div class="form-agreement">
          <label class="checkbox-container">
            <input type="checkbox" id="agreement-check">
            <span class="checkmark"></span>
            <span class="agreement-text" id="agreement-label-text"></span>
          </label>
        </div>

        <!-- 하단 액션 버튼 영역 -->
        <div class="form-actions">
          <button type="button" id="btn-back" class="btn btn-secondary"></button>
          <button type="submit" id="btn-submit" class="btn btn-primary"></button>
        </div>
      </form>
    </main>
  </div>

  <!-- [한글 주석: 유지보수 용이성을 위해 푸터 내용을 공통 JS(navigation.js)에서 동적 주입하도록 구조 개선] -->
  <footer id="global-footer" class="global-footer" style="width: 100%; margin-top: auto;"></footer>



  <!-- [한글 주석: 브라우저 캐시 무효화를 위한 버전 관리 적용 (모듈 JS 파일 버전: v=260828_2)] -->
  <script type="module" src="/js/navigation.js?v=260828_2"></script>
  <script type="module" src="/js/reservation.js?v=260828_2"></script>
  <script type="module" src="/js/auth.js?v=260828_2"></script>

  <!-- 개인정보 처리방침 모달 팝업 (reservation.js에서 언어에 맞게 콘텐츠 주입) -->
  <div id="privacy-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="privacy-modal-title">🔒 개인정보 처리방침</h2>
        <button id="btn-close-modal-x" class="modal-close-x">&times;</button>
      </div>
      <div class="modal-body" id="privacy-modal-body-content">
        <!-- 스크립트에서 동적 로딩되어 들어갑니다 -->
      </div>
      <div class="modal-footer" style="padding: 1.2rem 2rem;">
        <button id="btn-close-modal" class="btn btn-secondary"
          style="font-size: 0.9rem; padding: 0.5rem 1.5rem; min-width: 90px; margin: 0 auto;">확인</button>
      </div>
    </div>
  </div>
</body>

</html>
